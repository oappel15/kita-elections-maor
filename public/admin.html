<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ניהול הבחירות</title><link rel="stylesheet" href="style.css"></head><body>
<main>
<h1 class="noprint">⚙️ ניהול הבחירות</h1>
<section id="login" class="card center noprint"><p>קוד מנהל:</p><input id="ac" class="big" type="password"><br><br><button id="enter">כניסה</button><p class="err" id="le"></p></section>
<section id="app" hidden>
 <div class="tabs center noprint"><button data-t="res">📊 תוצאות</button><button data-t="codes">🔗 קישורים לכיתות</button><button data-t="cands">👥 מועמדים</button><button data-t="set">🔧 הגדרות</button><button class="sec" id="refresh">רענון</button></div>
 <p class="err center noprint" id="ae"></p>
 <div id="t-res" class="card tab"></div>
 <div id="t-codes" class="card tab" hidden></div>
 <div id="t-cands" class="card tab noprint" hidden></div>
 <div id="t-set" class="card tab noprint" hidden></div>
</section>
</main>
<footer>נוצר ע״י מאור מתתיהו · בעזרת Kita</footer>
<script>
const $=id=>document.getElementById(id);let AC=sessionStorage.ac||'',ST=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(b){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,adminCode:AC})});const j=await r.json().catch(()=>({error:'שגיאה'}));if(!r.ok)throw new Error(j.error||'שגיאה');return j}
async function load(){ST=await api({action:'state'});draw()}
$('enter').onclick=async()=>{AC=$('ac').value;try{await load();sessionStorage.ac=AC;$('login').hidden=true;$('app').hidden=false}catch(e){$('le').textContent=e.message}};
if(AC){$('ac').value=AC;$('enter').click()}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.hidden=t.id!=='t-'+b.dataset.t)});
$('refresh').onclick=()=>load().catch(e=>$('ae').textContent=e.message);
const RULE={boygirl:'מועמד + מועמדת',exact2:'בדיוק שניים',upto2:'עד שניים'};
function draw(){const C=ST.config,cls=Object.keys(C.classes);
 // results
 let h='<h2>תוצאות</h2><p>סה״כ הצבעות: <b>'+ST.votes+'</b> · ההצבעה '+(C.open?'<b style="color:green">פתוחה</b>':'<b style="color:#c00">סגורה</b>')+'</p>';
 for(const k of cls){const cs=C.classes[k];if(!cs.length)continue;
  h+='<h3>כיתה '+esc(k)+' <small>('+(ST.voted[k]||0)+' הצביעו · '+RULE[ST.rules[k]]+')</small></h3><table>';
  const max=Math.max(1,...cs.map(c=>ST.tally[c.id]||0));
  for(const c of [...cs].sort((a,b)=>(ST.tally[b.id]||0)-(ST.tally[a.id]||0)))h+='<tr><td style="width:35%">'+esc(c.name)+' '+(c.g==='m'?'👦':c.g==='f'?'👧':'')+'</td><td style="width:8%"><b>'+(ST.tally[c.id]||0)+'</b></td><td><div class="bar" style="width:'+(100*(ST.tally[c.id]||0)/max)+'%"></div></td></tr>';
  h+='</table>'}
 $('t-res').innerHTML=h+'<p class="noprint"><button class="sec" onclick="print()">🖨️ הדפסת תוצאות</button></p>';
 // class links
 const base=location.origin+'/?k=';
 h='<h2>קישור לכל כיתה</h2><p class="noprint">שולחים לכל מחנך/ת את הקישור של הכיתה בלבד (לא בקבוצות של תלמידים). הקישור נפתח ישר להצבעה, ואחרי כל תלמיד/ה המורה לוחץ/ת "תלמיד הבא".</p><p class="noprint"><button class="sec" onclick="print()">🖨️ הדפסת הטבלה</button> <button class="sec" onclick="copyAll()">📋 העתקת הכול</button></p><table><tr><th>כיתה</th><th>קישור</th><th>הצביעו</th><th class="noprint"></th></tr>';
 for(const k of cls){const p=ST.pins[k];if(!p)continue;const url=base+p.token;h+='<tr><td><b>'+esc(k)+'</b></td><td style="direction:ltr;text-align:left;font-size:.85rem">'+esc(url)+'</td><td>'+(ST.voted[k]||0)+'</td><td class="noprint"><button class="sec" onclick="cp(\''+k+'\')">📋 העתקה</button></td></tr>'}
 $('t-codes').innerHTML=h+'</table>';
 // candidates
 h='<h2>מועמדים</h2><p>חשוב: במצב "מועמד + מועמדת" צריך לסמן לכל ילד/ה בן או בת. כיתה עם סימון חסר תעבור אוטומטית ל"בדיוק שניים".</p>';
 for(const k of cls){const miss=C.classes[k].filter(c=>!c.g).length;h+='<h3>כיתה '+esc(k)+(miss?' <small style="color:#c00">('+miss+' בלי סימון)</small>':'')+'</h3><table>';
  C.classes[k].forEach((c,i)=>{h+='<tr><td><input value="'+esc(c.name)+'" onchange="ed(\''+k+'\','+i+',\'name\',this.value)"></td><td><select onchange="ed(\''+k+'\','+i+',\'g\',this.value)"><option value="">?</option><option value="m"'+(c.g==='m'?' selected':'')+'>בן</option><option value="f"'+(c.g==='f'?' selected':'')+'>בת</option></select></td><td><button class="sec" onclick="rm(\''+k+'\','+i+')">הסרה</button></td></tr>'});
  h+='<tr><td colspan="3"><button class="sec" onclick="add(\''+k+'\')">+ הוספת מועמד/ת</button></td></tr></table>'}
 h+='<p><button onclick="saveCfg()">💾 שמירת שינויים</button></p>';$('t-cands').innerHTML=h;
 // settings
 $('t-set').innerHTML='<h2>הגדרות</h2><p>כלל הבחירה: <select id="mode">'+Object.entries(RULE).map(([v,t])=>'<option value="'+v+'"'+(C.mode===v?' selected':'')+'>'+t+'</option>').join('')+'</select></p><p><label><input type="checkbox" id="open"'+(C.open?' checked':'')+'> ההצבעה פתוחה</label></p><p><button onclick="C2()">💾 שמירה</button></p><hr><p>איפוס מלא (מחיקת כל ההצבעות): <button class="danger" onclick="resetAll()">איפוס</button></p>';
}
function ed(k,i,f,v){ST.config.classes[k][i][f]=v}
function rm(k,i){ST.config.classes[k].splice(i,1);draw()}
function add(k){const n=prompt('שם המועמד/ת');if(n){ST.config.classes[k].push({name:n,g:''});draw()}}
async function saveCfg(){try{await api({action:'saveConfig',config:ST.config});await load();alert('נשמר')}catch(e){alert(e.message)}}
function C2(){ST.config.mode=$('mode').value;ST.config.open=$('open').checked;saveCfg()}
function line(k){const p=ST.pins[k];return 'כיתה '+k+': '+location.origin+'/?k='+p.token}
function cp(k){navigator.clipboard.writeText(line(k)).then(()=>alert('הועתק'))}
function copyAll(){navigator.clipboard.writeText(Object.keys(ST.config.classes).filter(k=>ST.pins[k]).map(line).join('\n')).then(()=>alert('הועתק'))}
async function resetAll(){const c=prompt('כדי למחוק את כל ההצבעות כתבו: אפס');if(!c)return;try{await api({action:'resetAll',confirm:c});await load()}catch(e){alert(e.message)}}
</script></body></html>
